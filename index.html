<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PSP Bridge — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #F0F4FF;
      --surface:  #FFFFFF;
      --border:   #D6E0FF;
      --text:     #111827;
      --muted:    #6B7280;
      --accent:   #4F6EF7;
      --accent-h: #3A56E0;
      --danger:   #E05252;
      --success:  #16A34A;
      --radius:   12px;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(#C7D4FF 1px, transparent 1px),
        linear-gradient(90deg, #C7D4FF 1px, transparent 1px);
      background-size: 36px 36px;
      opacity: 0.4;
      pointer-events: none;
    }

    .wrapper {
      position: relative;
      width: 100%;
      max-width: 420px;
      padding: 16px;
    }

    .logo {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo-name {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--accent);
      text-transform: uppercase;
      display: block;
      margin-bottom: 4px;
    }

    .logo h1 {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
      line-height: 1.3;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      box-shadow: 0 4px 24px rgba(79, 110, 247, 0.08);
    }

    .card-header {
      margin-bottom: 22px;
    }

    .card-header h2 {
      font-size: 17px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 3px;
    }

    .card-header p {
      font-size: 13px;
      color: var(--muted);
    }

    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 5px;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      background: #F8FAFF;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 13px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79,110,247,0.12);
    }

    input::placeholder { color: #B0B9CC; }

    .field-hint {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }

    .btn {
      width: 100%;
      padding: 11px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.15s, box-shadow 0.15s;
      letter-spacing: 0.01em;
    }

    .btn:hover {
      background: var(--accent-h);
      box-shadow: 0 4px 12px rgba(79,110,247,0.3);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 18px 0;
      color: var(--muted);
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .footer-links {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-top: 16px;
    }

    .footer-links a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    .security-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 18px;
      font-size: 11px;
      color: var(--muted);
    }

    .security-footer svg {
      width: 12px;
      height: 12px;
      stroke: var(--muted);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* intercept log */
    #intercept-log {
      display: none;
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 360px;
      background: #1a0a0a;
      border: 1px solid var(--danger);
      border-radius: var(--radius);
      padding: 16px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      color: #f87171;
      z-index: 100;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    }

    #intercept-log .log-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--danger);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #intercept-log .log-title::before {
      content: '';
      width: 7px;
      height: 7px;
      background: var(--danger);
      border-radius: 50%;
      display: inline-block;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.2; }
    }

    #intercept-log pre {
      white-space: pre-wrap;
      word-break: break-all;
      line-height: 1.7;
    }
  </style>
</head>
<body>

<div class="wrapper">
  <div class="logo">
    <span class="logo-name">PSP Bridge</span>
    <h1>Legacy PSP Browser<br>Bridge Testing Website</h1>
  </div>

  <div class="card">
    <div class="card-header">
      <h2>Sign in</h2>
      <p>Enter credentials to test cleartext capture via proxy.</p>
    </div>

    <form id="loginForm" action="#" method="post">
      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="off" />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••••••" autocomplete="off" />
        <div class="field-hint">Over HTTPS this is encrypted. Over HTTP it is not.</div>
      </div>

      <button type="submit" class="btn">Sign in</button>
    </form>

  </div>

  <div class="security-footer">
    <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    256-bit AES encryption &nbsp;·&nbsp; TLS 1.3
  </div>
</div>

<div id="intercept-log">
  <div class="log-title">Proxy intercept - cleartext capture</div>
  <pre id="intercept-content"></pre>
</div>

<script>
  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const email    = document.getElementById('email').value || '(empty)';
    const password = document.getElementById('password').value || '(empty)';
    const isHTTPS  = location.protocol === 'https:';

    const raw = `POST /login HTTP/1.1
Host: ${location.hostname}
Content-Type: application/x-www-form-urlencoded

email=${email}&password=${password}

${isHTTPS
  ? '[ HTTPS — credentials encrypted in transit.\n  Proxy cannot read this without MITM cert. ]'
  : '[ !! HTTP via downgrade proxy !!\n  Credentials fully visible in cleartext.\n  Any observer on the path can read this. ]'}`;

    document.getElementById('intercept-content').textContent = raw;
    document.getElementById('intercept-log').style.display = 'block';
  });
</script>

</body>
</html>
