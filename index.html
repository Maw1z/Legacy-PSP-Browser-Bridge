<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PSP Bridge — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #F0F4FF;
      --surface:  #FFFFFF;
      --border:   #D6E0FF;
      --text:     #111827;
      --muted:    #6B7280;
      --accent:   #4F6EF7;
      --accent-h: #3A56E0;
      --danger:   #E05252;
      --success:  #16A34A;
      --radius:   12px;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(#C7D4FF 1px, transparent 1px),
        linear-gradient(90deg, #C7D4FF 1px, transparent 1px);
      background-size: 36px 36px;
      opacity: 0.4;
      pointer-events: none;
    }

    .wrapper {
      position: relative;
      width: 100%;
      max-width: 420px;
      padding: 16px;
    }

    .logo {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo-name {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--accent);
      text-transform: uppercase;
      display: block;
      margin-bottom: 4px;
    }

    .logo h1 {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
      line-height: 1.3;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 30px;
      box-shadow: 0 4px 24px rgba(79, 110, 247, 0.08);
    }

    .card-header {
      margin-bottom: 20px;
    }

    .card-header h2 {
      font-size: 17px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 3px;
    }

    .card-header p {
      font-size: 13px;
      color: var(--muted);
    }

    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 5px;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      background: #F8FAFF;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 13px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79,110,247,0.12);
    }

    input::placeholder { color: #B0B9CC; }

    .field-hint {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }

    .btn {
      width: 100%;
      padding: 11px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.15s, box-shadow 0.15s;
      letter-spacing: 0.01em;
    }

    .btn:hover {
      background: var(--accent-h);
      box-shadow: 0 4px 12px rgba(79,110,247,0.3);
    }

  </style>
</head>
<body>

<div class="wrapper">
  <div class="logo">
    <span class="logo-name">PSP Bridge</span>
    <h1>Legacy PSP Browser<br>Bridge Testing Website</h1>
  </div>

  <div class="card">
    <div class="card-header">
      <h2>Sign in</h2>
      <p>Enter credentials to test cleartext capture via proxy.</p>
    </div>

    <form id="loginForm" action="#" method="post">
      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="off" />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••••••" autocomplete="off" />
        <div class="field-hint">Over HTTPS this is encrypted. Over HTTP it is not.</div>
      </div>

      <button type="submit" class="btn">Sign in</button>
    </form>

  </div>

</div>

<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
  e.preventDefault();
  alert('Logged in');
});
</script>

</body>
</html>
